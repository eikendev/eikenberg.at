<!doctype html>
<html
	lang="{{- with site.Language.Locale -}}
		{{ . }}
	{{- else -}}
		en-US
	{{- end -}}"
	dir="ltr"
	itemscope
	itemtype="https://schema.org/WebPage"
>
	<head>
		{{- partial "head.html" . -}}
	</head>
	<body>
		{{- block "content" . }}{{- end }}

		{{ $js := resources.Get "js/site.js" | js.Build (dict "minify" hugo.IsProduction "target" "es2019") }}
		{{ if hugo.IsProduction }}
			{{ $js = $js | fingerprint "sha512" }}
		{{ end }}
		<script
			src="{{ $js.RelPermalink }}"
			{{ with $js.Data.Integrity }}integrity="{{ . }}"{{ end }}
			defer
		></script>
	</body>
</html>
